<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="description" content="Pantau akun, mesin strategi, dan pengaman risiko EA MTRB Pro dari satu halaman.">
<title>MTRB Pro: dashboard EA emas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e6be5a'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' fill='none' stroke='%231a1405' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Satu sistem: 3 radius, 1 gaya kartu, 3 gaya tombol, 1 aksen (emas), teks minimal 12px, sasaran sentuh 44px. */
:root{
  --bg:#0d0f14; --card:#161920; --card2:#1f232d; --line:#2a2f3b; --line2:#3b4252;
  --text:#e9ecf2; --soft:#c5cbd8; --dim:#939cae;
  --gold:#e6be5a; --gold-ink:#1a1405; --up:#3fcf8e; --dn:#f2707b; --warn:#f0a93c; --info:#6ea8ff;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --gap:12px; --pad:16px; --rail:216px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* kerangka */
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 var(--pad) calc(88px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.mark{width:36px;height:36px;border-radius:var(--r-sm);background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand{min-width:0;line-height:1.25}
.bname{display:block;font-weight:700;font-size:16px}
.brand small{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--up)} .pill.bad{color:var(--dn)} .pill.warn{color:var(--warn)} .pill.gold{background:var(--gold);color:var(--gold-ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
h1{font-size:26px;line-height:1.2;margin:12px 0 16px;letter-spacing:-.3px}
h2{font-size:14px;font-weight:600;color:var(--dim);margin:24px 0 10px}
h3{margin:0;font-size:19px;line-height:1.25}

/* kartu dan isi */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad)}
.card + .card{margin-top:var(--gap)}
.card.list{padding:2px var(--pad)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--dim)} .small{font-size:13px} .up{color:var(--up)} .dn{color:var(--dn)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:32px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kv .k{font-size:12px;color:var(--dim)} .kv .v{font-weight:600;font-size:15px}
.hr{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.bar.hot > i{background:var(--dn)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ico{width:40px;height:40px;border-radius:var(--r-md);background:var(--card2);color:var(--soft);display:grid;place-items:center;flex:none}
.ico.up{color:var(--up)} .ico.dn{color:var(--dn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:600;line-height:1.3;padding:3px 8px;border-radius:var(--r-sm);background:var(--card2);color:var(--dim);white-space:nowrap}
.tag.ok{color:var(--up)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--dn)} .tag.na{color:var(--info)}
.empty{text-align:center;color:var(--dim);padding:28px 8px}
.note{border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin-bottom:var(--gap);background:rgba(240,169,60,.12);color:var(--warn)}
.note.bad{background:rgba(242,112,123,.12);color:var(--dn)}
.hint{font-size:13px;color:var(--dim);margin:8px 2px 0}

/* daftar baris (posisi, sesi, news, setelan) */
.pos{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.pos:last-child{border-bottom:0}
.pos.mid{align-items:center}

/* tab posisi */
.seg{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:24px 0 var(--gap)}
.seg button{min-height:44px;color:var(--dim);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.seg button:hover{color:var(--soft)}
.seg button.on{color:var(--text);border-color:var(--gold)}
.cnt{font-size:12px;background:var(--card2);padding:1px 8px;border-radius:99px;margin-left:6px;color:var(--dim)}

/* kartu mesin */
.bot{cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .1s}
.bot:hover{border-color:var(--line2)}
.bot:active{transform:scale(.995)}
.bot.off .ico,.bot.off .name,.bot.off .status,.bot.off .grid3{opacity:.55}
.bot .name{font-weight:700;font-size:16px;line-height:1.3}
.bot .status{flex:1;margin:14px 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--soft);overflow-wrap:anywhere}

/* saklar: jalur 46x28 di dalam sasaran sentuh 52x44 */
.sw{width:52px;height:44px;position:relative;flex:none;border-radius:var(--r-md)}
.sw::before{content:"";position:absolute;left:3px;top:8px;width:46px;height:28px;border-radius:99px;background:#3a4150;transition:background .15s}
.sw::after{content:"";position:absolute;left:6px;top:11px;width:22px;height:22px;border-radius:50%;background:#cfd4de;transition:transform .15s,background .15s}
.sw:hover::before{background:#454d5f}
.sw.on::before{background:var(--gold)} .sw.on:hover::before{background:#efcb72}
.sw.on::after{transform:translateX(18px);background:#fff}

/* tombol: utama (emas), biasa, bahaya */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;padding:0 16px;border-radius:var(--r-md);font-weight:700;text-align:center;text-decoration:none;background:var(--card2);border:1px solid var(--line);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--line2);background:#252a36}
.btn:active{transform:scale(.985)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)} .btn.gold:hover{background:#efcb72;border-color:#efcb72}
.btn.danger{background:rgba(242,112,123,.12);border-color:transparent;color:var(--dn)} .btn.danger:hover{background:rgba(242,112,123,.2)}
.x{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;transition:background .15s}
.x:hover{background:#2a303d}

/* setelan angka */
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set label{flex:1;min-width:0;font-weight:600}
.set label span{display:block;font-weight:400;font-size:13px;color:var(--dim)}
.inp{width:92px;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:inherit;font-size:16px;font-weight:600;padding:0 12px;text-align:right;font-variant-numeric:tabular-nums;transition:border-color .15s}
.inp:hover{border-color:var(--line2)}
.inp.full{width:100%;text-align:left}
.unit{width:32px;font-size:13px;color:var(--dim);flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 0 4px}
.opt{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);color:var(--soft);font-weight:600;text-align:left;transition:border-color .15s,color .15s}
.opt:hover{border-color:var(--line2)}
.opt.on{border-color:var(--gold);color:var(--text)}

/* bias */
.tfs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.tf{text-align:center;background:var(--card2);border-radius:var(--r-sm);padding:6px 0;font-size:12px;color:var(--dim)}
.tf b{display:block}

/* analisa */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;font-weight:600;color:var(--dim);text-align:right;padding:10px 0 8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:10px 0 10px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0;white-space:normal}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;align-items:end;height:120px}
.hours i{display:block;border-radius:3px 3px 0 0}
.hours i.up{background:var(--up)} .hours i.dn{background:var(--dn)}
.hlab{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px;font-size:12px;color:var(--dim);margin-top:6px;overflow:visible}
.hlab span{white-space:nowrap}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:10px;background:var(--card2)}
.split i{display:block;height:100%} .split .b{background:var(--up)} .split .s{background:var(--dn)}
.sel{display:block;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);font:inherit;padding:0 10px;width:100%;margin-top:4px;color-scheme:dark}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn[disabled]{opacity:.6;cursor:default}

/* navigasi: bar bawah di HP, rel kiri di layar lebar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,15,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .inner{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;min-height:56px;color:var(--dim);font-size:12px;font-weight:600;transition:color .15s,background .15s}
.tabs button .i{margin:0 auto 3px;width:22px;height:22px}
.tabs button:hover{color:var(--soft)}
.tabs button.on{color:var(--gold)}
.rbrand{display:none}

/* lembar detail, dialog, toast */
.veil{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;animation:rise .2s ease-out}
.sheet ul{margin:0;padding-left:18px;color:var(--soft)} .sheet li{margin:6px 0}
.modal{align-items:center;padding:20px}
.modal .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:#2a303d;color:var(--text);padding:10px 16px;border-radius:var(--r-md);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (min-width:960px){
  body{padding-left:var(--rail)}
  .app{max-width:1160px;padding:0 32px 48px}
  .top{padding:16px 0}
  .top .mark,.top .bname{display:none}
  .brand small{font-size:14px}
  h1{font-size:30px;margin:8px 0 20px}
  .tabs{right:auto;top:0;width:var(--rail);border-top:0;border-right:1px solid var(--line);background:var(--bg);backdrop-filter:none;padding:16px 12px}
  .tabs .inner{flex-direction:column;gap:4px;max-width:none}
  .rbrand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:0 8px 20px}
  .tabs button{flex:none;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:var(--r-md);font-size:15px;text-align:left}
  .tabs button .i{margin:0}
  .tabs button:hover{background:var(--card)}
  .tabs button.on{background:var(--card2);color:var(--text)}
  .tabs button.on .i{color:var(--gold)}
  .cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}
  .cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols > div > h2:first-child,.cols > div > .seg:first-child{margin-top:0}
  #bots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
  #bots .card + .card{margin-top:0}
  .veil{align-items:center;padding:24px}
  .sheet{border-radius:var(--r-lg);border-bottom:1px solid var(--line);padding:22px}
  .toast{bottom:32px;left:calc(50% + var(--rail) / 2)}
}
@media (min-width:1400px){ #bots{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true">M</div>
    <div class="brand"><span class="bname">MTRB Pro</span><small id="sub">dashboard</small></div>
    <div class="sp"></div>
    <span class="pill" id="mode" hidden></span>
    <span class="pill" id="conn" role="status"><span class="dot"></span>Memuat</span>
  </header>

  <main>
    <div id="alerts"></div>

    <section id="p-akun">
      <h1>Akun</h1>
      <div class="cols">
        <div id="acct"></div>
        <div>
          <div class="seg" role="tablist" aria-label="Daftar posisi">
            <button class="on" data-pl="open" role="tab" aria-selected="true">Terbuka<span class="cnt" id="c-open">0</span></button>
            <button data-pl="closed" role="tab" aria-selected="false">Tertutup<span class="cnt" id="c-closed">0</span></button>
          </div>
          <div class="card list" id="plist"></div>
        </div>
      </div>
    </section>

    <section id="p-robot" hidden>
      <h1>Robot</h1>
      <div id="bsum"></div>
      <h2>Mesin strategi</h2>
      <p class="hint" id="refr" style="margin:-4px 0 12px"></p>
      <div id="bots"></div>
    </section>

    <section id="p-atur" hidden>
      <h1>Pengaturan</h1>
      <div id="sets"></div>
    </section>

    <section id="p-ana" hidden>
      <h1>Analisa</h1>
      <div class="cols even">
        <div><div id="ana"></div></div>
        <div><div id="alive"></div><div id="aexp"></div><div id="aml"></div></div>
      </div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Halaman">
  <div class="rbrand"><div class="mark" aria-hidden="true">M</div>MTRB Pro</div>
  <div class="inner">
    <button class="on" data-tab="akun" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12.5h18"/></svg>Akun</button>
    <button data-tab="robot"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4.5M9 13.5h.01M15 13.5h.01M2 13v2M22 13v2"/></svg>Robot</button>
    <button data-tab="atur"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Pengaturan</button>
    <button data-tab="ana"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Analisa</button>
  </div>
</nav>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail mesin"></div></div>
<div class="veil modal" id="modal"><div class="box" id="mbox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const DEMO = new URLSearchParams(location.search).has("demo");
const Q = DEMO ? "&demo=1" : "";
let S = null, plTab = "open", pin = "", openSheet = null, lastOk = 0;
const PEND = {};
let holdSets = 0;
try { pin = localStorage.getItem("mtrb_pin") || ""; } catch (e) {}

// Satu keluarga ikon garis (24px, tebal 1.8) untuk semua mesin dan arah posisi.
const ICON = {
  breakout: '<path d="M5 19 19 5M10 5h9v9"/>',
  trendline: '<path d="M4 18 20 6"/><circle cx="8.5" cy="14.6" r="1.6"/><circle cx="15.5" cy="9.4" r="1.6"/>',
  orb: '<rect x="3.5" y="7" width="9" height="10" rx="1.5"/><path d="M12.5 12H20M17 9l3 3-3 3"/>',
  dip: '<path d="M3 7l6 9 4-5 3 3 5-8"/>',
  candle: '<path d="M8 3v4M8 15v6M16 3v6M16 17v4"/><rect x="6" y="7" width="4" height="8" rx="1"/><rect x="14" y="9" width="4" height="8" rx="1"/>',
  rsima: '<path d="M3 12c3-7 6-7 9 0s6 7 9 0"/>',
  range: '<path d="M3 6h18M3 18h18M6 15l4-6 4 6 4-6"/>',
  momentum: '<path d="M5 6l6 6-6 6M13 6l6 6-6 6"/>',
  smc: '<path d="M12 3l8 9-8 9-8-9z"/><path d="M8.5 12h7"/>',
  main: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>'
};
const ic = n => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || ICON.main) + "</svg>";

// Keterangan tiap mesin: aturan singkat dan hasil pengujian sejauh ini.
const META = {
  breakout: { icon: "breakout", kind: "Breakout", rules: [
    "Arah mengikuti tren harian (D1).",
    "Entry saat candle menutup di luar high/low 55 bar terakhir.",
    "SL 1,5 × ATR, TP 3 kali jarak SL.",
    "Setelah untung 1 kali jarak SL, SL mengikuti harga." ] },
  trendline: { icon: "trendline", kind: "Garis tren", rules: [
    "Arah mengikuti tren harian (D1).",
    "Garis tren ditarik otomatis dari swing, minimal 3 sentuhan.",
    "Entry tiga langkah: break, retest, lalu candle menutup searah.",
    "Tanpa TP: keluar saat garis tren seberang ditembus." ] },
  orb: { icon: "orb", kind: "Opening range", rules: [
    "Range diukur dari 30 menit pertama sesi.",
    "Entry saat candle M5 menutup di luar range, maksimal 1 trade per hari.",
    "SL di tengah range, TP 2 kali jarak SL.",
    "Posisi ditutup paling lambat 6 jam setelah sesi buka." ] },
  nao: { icon: "momentum", kind: "Scalping 10 detik", rules: [
    "Arah: EMA 5 / 20 / 40 berurutan dan PSAR searah, di M1 dan di M5.",
    "Entry saat PSAR pada bar 10 detik baru berbalik ke arah itu, bertahan 1 bar, dan EMA 10 detik ikut searah.",
    "Keluar saat PSAR 10 detik berbalik melawan posisi, atau muncul sinyal berlawanan.",
    "SL pengaman 2,00 dari harga entry, tanpa TP.",
    "Entry hanya jam 09–21 server dan spread maksimal 0,30. Maksimal 1 posisi.",
    "Butuh sekitar 9 menit setelah EA dimuat untuk mengumpulkan bar 10 detik." ] },
  candle: { icon: "candle", kind: "Pola candle", rules: [
    "Sell saat muncul Dark Cloud Cover atau Hanging Man dan RSI 37 di atas 60.",
    "Buy saat muncul Piercing Line atau Hammer dan RSI 37 di bawah 40.",
    "Arah tren dari SMA 5; ukuran candle dibanding rata-rata badan 12 candle.",
    "SL 2,00 dan TP 2,00 dari harga entry.",
    "Keluar juga saat RSI memotong 30 atau 70, atau setelah 10 candle.",

const money = (n, cur) => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + (cur ? " " + cur : "");
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cls = n => (n > 0 ? "up" : n < 0 ? "dn" : "muted");
const price = (n, d) => Number(n).toLocaleString("id-ID", { minimumFractionDigits: d, maximumFractionDigits: d });
const p2 = n => String(n).padStart(2, "0");
// waktu dari EA adalah waktu server broker; ditampilkan apa adanya
const tsrv = e => { const d = new Date(e * 1000); return p2(d.getUTCDate()) + "/" + p2(d.getUTCMonth() + 1) + " " + p2(d.getUTCHours()) + ":" + p2(d.getUTCMinutes()); };
const kv = (k, v, c) => '<div class="kv"><div class="k">' + k + '</div><div class="v num ' + (c || "") + '">' + v + "</div></div>";
const sw = (on, label, attr) => '<button class="sw' + (on ? " on" : "") + '" role="switch" aria-checked="' + !!on + '" aria-label="' + esc(label) + '" ' + attr + "></button>";
const sideIco = side => '<div class="ico ' + (side === "BUY" ? "up" : "dn") + '">' + ic(side === "BUY" ? "up" : "down") + "</div>";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2400); }

async function api(action, body) {
  const opt = { headers: { "X-Pin": pin }, cache: "no-store" };
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("api.php?a=" + action + Q, opt);
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { askPin(); throw new Error("pin"); }
  if (!j) throw new Error("http " + r.status);
  return j;
}

async function control(body, okMsg) {
  try {
    const j = await api("control", body);
    if (!j.ok) throw new Error(j.error || "gagal");
    toast(DEMO ? "Mode contoh: perintah tidak dikirim ke EA" : okMsg);
    return true;
  } catch (e) { if (e.message !== "pin") toast("Gagal mengirim perintah (" + e.message + ")"); return false; }
}

function setConn(kind, text) { const c = $("#conn"); c.className = "pill " + kind; c.innerHTML = '<span class="dot"></span>' + esc(text); }

async function poll() {
  try {
    const j = await api("status");
    if (!j.ok) { S = null; renderEmpty(j.error); return; }
    S = j.data; S._age = j.age; S._demo = !!j.demo; lastOk = Date.now();
    // EA butuh beberapa detik untuk membaca perintah: sementara itu tampilkan pilihan terakhir pengguna
    const now = Date.now();
    Object.keys(PEND).forEach(k => {
      if (PEND[k].t < now) { delete PEND[k]; return; }
      if (k === "paused") S.risk.paused = PEND[k].on;
      else if (k === "flag:news_filter") S.risk.news_filter = PEND[k].on;
      else if (k === "flow_mode") S.risk.flow_mode = PEND[k].v;
      else if (k.indexOf("rule:") === 0) { const e = S.engines.find(x => x.id === k.slice(5)); if (e) { e.blk = PEND[k].blk; e.msp = PEND[k].msp; } }
      else if (k.indexOf("flag:sess_") === 0) { if (S.sessions) S.sessions[k.slice(10) === "asia" ? "asia" : k.slice(10) === "london" ? "london" : "ny"] = PEND[k].on; }
      else { const e = S.engines.find(x => x.id === k); if (e) e.enabled = PEND[k].on; }
    });
    render();
  } catch (e) {
    if (e.message === "pin") return;
    setConn("bad", "Server tidak terjangkau");
  }
}

let A = null, aBusy = false, aErr = "", aAt = 0, xFull = true;

async function loadAnalysis(force) {
  if (aBusy) return;
  if (DEMO) { aErr = "demo"; renderAna(); return; }
  aBusy = true; renderAna();
  try {
    const j = await api(force ? "analyze" : "analysis", force ? { run: 1 } : null);
    if (j.ok) { A = j.data; aAt = Date.now(); aErr = j.run_log ? "Analisa ulang gagal, yang tampil hasil sebelumnya. " + j.run_log : ""; }
    else aErr = j.error === "no_data" ? "nodata" : "Analisa gagal (" + j.error + ")" + (j.log ? ": " + j.log : "");
  } catch (e) { if (e.message !== "pin") aErr = "Server tidak terjangkau"; }
  aBusy = false; renderAna();
  if (force && A && !aErr) toast("Analisa selesai");
}

function hoursChart(rows) {
  const m = {}; rows.forEach(r => m[r.key] = r);
  const mx = Math.max(1e-9, ...rows.map(r => Math.abs(r.total)));
  let b = "", l = "";
  for (let i = 0; i < 24; i++) {
    const r = m[i];
    b += r ? '<i class="' + (r.total >= 0 ? "up" : "dn") + '" style="height:' + Math.max(3, Math.abs(r.total) / mx * 100).toFixed(0) + '%" title="' + p2(i) + ":00 WIB · " + r.n + " trade · " + signed(r.total) + '"></i>' : "<i></i>";
    l += "<span>" + (i % 3 === 0 ? p2(i) : "") + "</span>";
  }
  const sorted = rows.filter(r => r.n >= 3).sort((x, y) => y.total - x.total);
  const bw = sorted.length >= 2 ? '<div class="grid2 hr">' + kv("Jam terbaik", p2(sorted[0].key) + ":00 · " + signed(sorted[0].total), "up") + kv("Jam terburuk", p2(sorted[sorted.length - 1].key) + ":00 · " + signed(sorted[sorted.length - 1].total), "dn") + "</div>" : "";
  return '<div class="card"><div class="hours" role="img" aria-label="Profit per jam entry">' + b + '</div><div class="hlab">' + l + "</div>" + bw +
    '<div class="small muted" style="margin-top:10px">Hijau untung, merah rugi. Tinggi batang = besar total di jam itu.</div></div>';
}

      h += '<div class="card"><div class="row" style="align-items:flex-start"><b class="grow">' + esc(r.title) + '</b><span class="tag ' + (u ? "ok" : "warn") + '">' + (u ? "Terbukti di data terbaru" : "Petunjuk awal") + "</span></div>" +

        (r.apply ? '<button class="btn' + (u ? " gold" : "") + '" data-rec="' + i + '" style="margin-top:14px">Terapkan</button>' : "") + "</div>";
    });
    h += '<p class="hint">Saran tidak pernah diterapkan otomatis. "Terbukti" artinya pola dari 70% data lama juga rugi di 30% data terbaru. Tetap bukan jaminan.</p>';
    h += "<h2>Per mesin</h2>" + table(["Mesin", "Trade", "Menang", "PF", "Total"], A.engines.map(e => stRow(esc(e.key), e)));
    h += "<h2>Profit per jam entry (WIB)</h2>" + hoursChart(A.hours || []);
    h += "<h2>Per hari</h2>" + table(["Hari", "Trade", "Menang", "PF", "Total"], (A.dow || []).map(e => stRow(esc(e.key), e)));
    if (A.sessions && A.sessions.length) h += "<h2>Per sesi</h2>" + table(["Sesi", "Trade", "Menang", "PF", "Total"], A.sessions.map(e => stRow(esc(e.key), e)));
    h += "<h2>Cara keluar</h2>" + table(["Keluar lewat", "Trade", "Menang", "PF", "Total"], (A.reasons || []).map(e => stRow(esc(({ SL: "Stop loss", TP: "Take profit", EA: "Ditutup EA", OTHER: "Manual / lain", STOPOUT: "Stop out" })[e.key] || e.key), e)));

    // kolom kanan: profit tertinggi, volume, ML
    const t = A.tp;
    if (t && t.reach && t.reach.length) {
      ml += "<h2>Profit tertinggi selama posisi terbuka</h2><div class='card'><div class='small muted'>Persen trade yang sempat mencapai profit ini sebelum ditutup. Median: " + f2(t.mfe_median) + ".</div>" +
        '<div class="grid3" style="margin-top:10px">' + t.reach.map(x => kv("≥ " + x.usd, pct(x.pct))).join("") + "</div>" +
        (t.global ? '<div class="hr small">TP tetap terbaik di data ini <b>' + f2(t.global.tp) + "</b>: hasil " + signed(t.global.sim_total) + " dibanding sekarang " + signed(t.global.actual_total) + ".</div>" : "") + "</div>";
      if (t.engines.length) ml += table(["Mesin", "Median", "TP terbaik", "Hasil TP", "Sekarang"], t.engines.map(e => [esc(e.engine), f2(e.mfe_median), f2(e.tp), sg(e.sim_total), sg(e.actual_total)]));
    }
    if (A.flow) {
      ml += "<h2>Trade menurut Buy/Sell volume</h2>" + table(["Saat entry", "Trade", "Menang", "PF", "Total"], [stRow("Volume mendukung", A.flow.pass), stRow("Tidak mendukung", A.flow.fail)]) +
        '<p class="hint">Dicatat di semua trade, juga saat filter belum dinyalakan, supaya bisa dibandingkan.</p>';
    }
  }
  const m = A && A.ml;
  if (m) {
    ml += "<h2>Machine learning</h2><div class='card'>";
    if (m.status === "kurang_data") {
      const p = Math.min(100, (m.n || 0) / m.need * 100);
      ml += "<b>Mengumpulkan data</b><div class='small muted' style='margin-top:4px'>Model dilatih setelah ada " + m.need + " trade dengan catatan kondisi pasar. Sekarang " + (m.n || 0) + ".</div><div class='bar'><i style='width:" + p.toFixed(0) + "%'></i></div>";
    } else if (m.status === "no_sklearn") ml += "<div class='small muted'>Python di komputer ini belum punya scikit-learn.</div>";
    else if (m.status === "satu_kelas") ml += "<div class='small muted'>Semua trade di salah satu periode menang semua atau kalah semua, jadi model belum bisa dilatih.</div>";
    else {
      ml += '<div class="grid3">' + kv("Trade", m.n) + kv("Menang", pct(m.base_winrate)) + kv("AUC", f2(m.auc), m.auc >= 0.62 ? "up" : m.auc < 0.55 ? "dn" : "") + "</div>" +
        '<div class="small" style="margin-top:10px;color:var(--soft)">' + esc(m.verdict) + '</div><div class="small muted" style="margin-top:4px">AUC 0,50 = setara tebakan, 1,00 = sempurna. Diuji di ' + m.n_test + " trade terbaru yang tidak dipakai melatih.</div>";
      if (m.importance && m.importance.length) {
        const mx = Math.max(...m.importance.map(x => x.imp));
        ml += '<div class="hr small muted">Kondisi yang paling memengaruhi menang/kalah</div>' + m.importance.map(x => '<div class="row small" style="margin-top:8px"><span class="grow">' + esc(x.feature) + '</span></div><div class="bar" style="margin-top:4px"><i style="width:' + (x.imp / mx * 100).toFixed(0) + '%"></i></div>').join("");
      }
      if (m.rules && m.rules.length) {
        ml += '<div class="hr small muted">Kondisi yang cenderung rugi</div>' + m.rules.map(r => '<div style="margin-top:10px"><div class="row" style="align-items:flex-start"><span class="grow small" style="color:var(--soft)">' + esc(r.text) + '</span><span class="tag ' + (r.proven ? "ok" : "warn") + '">' + (r.proven ? "Terbukti" : "Belum terbukti") + "</span></div>" +
          '<div class="small muted">' + r.n_train + " trade lama rata-rata " + signed(r.avg_train) + (r.n_test ? " · " + r.n_test + " trade baru rata-rata " + signed(r.avg_test) : "") + "</div></div>").join("");
      }
    }
    ml += "</div>";
  }
  $("#ana").innerHTML = h;
  $("#aml").innerHTML = ml;
  renderAnaLive();
}

function applyLocal(b) {
  const t = Date.now() + 7000;
  Object.keys(b).forEach(k => {
    if (k === "engine") { PEND[b.engine] = { on: b.on, t: t }; const e = S.engines.find(x => x.id === b.engine); if (e) e.enabled = b.on; }
    else if (/^(blk|msp)_/.test(k)) {
      const e = S.engines.find(x => x.id === k.slice(4)); if (!e) return;
      if (k[0] === "b") e.blk = String(b[k]); else e.msp = +b[k];
      PEND["rule:" + e.id] = { blk: e.blk, msp: e.msp, t: t };
    }
    else if (k === "flow_mode") { S.risk.flow_mode = b[k]; PEND.flow_mode = { v: b[k], t: t }; }
    else if (k in S.risk) { S.risk[k] = b[k]; holdSets = 0; }
  });
  render();
  holdSets = Date.now() + 7000;
}

async function doExport() {
  if (DEMO) { toast("Mode contoh: export tidak tersedia"); return; }
  const q = new URLSearchParams({ a: "export", fmt: $("#xm").value });
  if ($("#xe").value) q.set("engine", $("#xe").value);
  if ($("#xf").value) q.set("from", $("#xf").value);
  if ($("#xt").value) q.set("to", $("#xt").value);
  if (!xFull) q.set("basic", "1");
  try {
    const r = await fetch("api.php?" + q.toString(), { headers: { "X-Pin": pin }, cache: "no-store" });
    if (r.status === 401) { askPin(); return; }
    if ((r.headers.get("Content-Type") || "").indexOf("text/csv") < 0) {
      const j = await r.json().catch(() => ({}));
      toast(j.error === "no_data" ? "Belum ada riwayat trade dari EA" : "Export gagal");
      return;
    }
    const n = r.headers.get("X-Rows"), blob = await r.blob(), mm = (r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = mm ? mm[1] : "mtrb_riwayat.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast((n || 0) + " trade diexport");
  } catch (e) { toast("Export gagal"); }
}

function hideSheet() { openSheet = null; $("#veil").classList.remove("show"); }

function confirmBox(title, text, yes, danger, fn) {
  $("#mbox").innerHTML = "<h3>" + esc(title) + "</h3><div class='muted' style='margin-top:8px'>" + esc(text) + "</div>" +
    "<div class='grid2' style='margin-top:20px'><button class='btn' id='mno'>Batal</button><button class='btn " + (danger ? "danger" : "gold") + "' id='myes'>" + esc(yes) + "</button></div>";
  $("#modal").classList.add("show");
  $("#mno").onclick = () => $("#modal").classList.remove("show");
  $("#myes").onclick = () => { $("#modal").classList.remove("show"); fn(); };
  $("#mno").focus();
}
function askPin() {
  $("#mbox").innerHTML = "<h3>Masukkan PIN</h3><label for='pin' class='muted' style='display:block;margin:8px 0 12px'>Dashboard ini dilindungi PIN.</label>" +
    "<input class='inp full' id='pin' type='password' inputmode='numeric' autocomplete='off'><button class='btn gold' id='pok' style='margin-top:14px'>Masuk</button>";
  $("#modal").classList.add("show");
  const go = () => { pin = $("#pin").value; try { localStorage.setItem("mtrb_pin", pin); } catch (e) {} $("#modal").classList.remove("show"); poll(); };
  $("#pok").onclick = go; $("#pin").onkeydown = e => { if (e.key === "Enter") go(); }; $("#pin").focus();
}

async function toggleEngine(id) {
  const e = S && S.engines.find(x => x.id === id); if (!e) return;
  const on = !e.enabled, v = VERDICT[id] || [];
  const run = async () => { if (await control({ engine: id, on: on }, e.name + (on ? " dinyalakan" : " dimatikan"))) { PEND[id] = { on: on, t: Date.now() + 7000 }; e.enabled = on; render(); } };
  if (on && (v[0] === "bad" || v[0] === "warn" || v[0] === "na"))
    confirmBox("Nyalakan " + e.name + "?", v[1] + ". " + v[2], "Tetap nyalakan", false, run);
  else run();
}

document.addEventListener("click", ev => {
  const t = ev.target;
  const tab = t.closest("[data-tab]");
  if (tab) {
    document.querySelectorAll("[data-tab]").forEach(b => { b.classList.toggle("on", b === tab); if (b === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    ["akun", "robot", "atur", "ana"].forEach(n => $("#p-" + n).hidden = n !== tab.dataset.tab); window.scrollTo(0, 0);
    if (tab.dataset.tab === "ana") { renderAna(); if (!A || Date.now() - aAt > 60000) loadAnalysis(false); }
    return;
  }
  if (t.id === "arun") { loadAnalysis(true); return; }
  if (t.id === "xgo") { doExport(); return; }
  if (t.id === "xfull") { xFull = !xFull; t.classList.toggle("on", xFull); t.setAttribute("aria-checked", xFull); return; }
  const rb = t.closest("[data-rec]");
  if (rb && A) {
    const r = A.recs[+rb.dataset.rec], body = Object.assign({}, r.apply);
    Object.keys(body).forEach(k => {                    // jam yang sudah diblok sebelumnya tetap diblok
      if (k.indexOf("blk_") !== 0 || !S) return;
      const e = S.engines.find(x => x.id === k.slice(4));
      if (e && e.blk) body[k] = Array.from(new Set((e.blk + "," + body[k]).split(",").filter(Boolean).map(Number))).sort((x, y) => x - y).join(",");
    });
    confirmBox("Terapkan saran?", r.title + ". " + (r.confidence === "uji" ? "" : "Saran ini baru petunjuk awal dan belum terbukti di data terbaru. ") + "Bisa dibatalkan kapan saja dari halaman Analisa atau Pengaturan.", "Terapkan", false,
      () => control(body, "Saran diterapkan").then(ok => { if (ok) applyLocal(body); }));
    return;
  }
  const ur = t.closest("[data-unrule]");
  if (ur) { const id = ur.dataset.unrule, body = {}; body["blk_" + id] = ""; body["msp_" + id] = 0; control(body, "Aturan dihapus").then(ok => { if (ok) applyLocal(body); }); return; }
  const fb = t.closest("[data-flow]");
  if (fb) {
    const v = +fb.dataset.flow; if (v === S.risk.flow_mode) return;
    const go = () => control({ flow_mode: v }, ["Estimasi volume dimatikan", "Volume: tampil saja", "Filter volume aktif"][v]).then(ok => { if (ok) applyLocal({ flow_mode: v }); });
    if (v === 2) confirmBox("Nyalakan filter volume?", "Entry yang volumenya tidak mendukung akan ditolak, jadi jumlah trade berkurang. Filter ini belum diuji; cek dulu tabel \"Trade menurut Buy/Sell volume\" di halaman ini.", "Nyalakan filter", false, go);
    else go();
    return;
  }
  const pl = t.closest("[data-pl]");
  if (pl) { plTab = pl.dataset.pl; document.querySelectorAll("[data-pl]").forEach(b => { b.classList.toggle("on", b === pl); b.setAttribute("aria-selected", b === pl); }); if (S) render(); return; }
  const swb = t.closest("[data-sw]");
  if (swb) { ev.stopPropagation(); toggleEngine(swb.dataset.sw); return; }
  const bot = t.closest(".bot");
  if (bot) { showSheet(bot.dataset.id); return; }
  if (t.id === "veil" || t.closest("#sx")) { hideSheet(); return; }
  if (t.id === "stog") { const id = openSheet; hideSheet(); toggleEngine(id); return; }
  if (t.id === "modal") { $("#modal").classList.remove("show"); return; }
  if (t.id === "sw-pause") { const on = !S.risk.paused; control({ paused: on }, on ? "Entry baru dihentikan" : "Entry baru diizinkan lagi").then(ok => { if (ok) { PEND.paused = { on: on, t: Date.now() + 7000 }; S.risk.paused = on; holdSets = 0; render(); } }); return; }
  const fl = t.closest("[data-flag]");
  if (fl) {
    const key = fl.dataset.flag, map = { sess_asia: "asia", sess_london: "london", sess_ny: "ny" };
    const cur = key === "news_filter" ? S.risk.news_filter : S.sessions[map[key]], on = !cur;
    const label = key === "news_filter" ? "Hindari news" : "Sesi " + ({ sess_asia: "Asia", sess_london: "London", sess_ny: "New York" })[key];
    const body = {}; body[key] = on;
    control(body, label + (on ? " dinyalakan" : " dimatikan")).then(ok => {
      if (!ok) return;
      PEND["flag:" + key] = { on: on, t: Date.now() + 7000 };
      if (key === "news_filter") S.risk.news_filter = on; else S.sessions[map[key]] = on;
      holdSets = 0; renderSettings();
    });
    return;
  }
  if (t.id === "save") {
    const num = id => parseFloat(String($(id).value).replace(",", "."));
    const a = num("#in-risk"), b = num("#in-loss"), mn = num("#in-slmin"), mx = num("#in-slmax");
    if (!(a >= 0) || !(b >= 0) || b > 100 || !(mn >= 0) || !(mx >= 0)) { toast("Isi dengan angka yang benar"); return; }
    if (mn > 0 && mx > 0 && mn > mx) { toast("SL minimal tidak boleh lebih besar dari SL maksimal"); return; }
    control({ max_open_risk: a, daily_loss_pct: b, sl_min: mn, sl_max: mx }, "Pengaman disimpan").then(ok => {
      if (ok) { S.risk.max_open_risk = a; S.risk.daily_loss_pct = b; S.risk.sl_min = mn; S.risk.sl_max = mx; holdSets = 0; document.activeElement.blur(); renderSettings(); holdSets = Date.now() + 7000; }
    });
    return;
  }
  const md = t.closest("[data-mode]");
  if (md) {
    const on = md.dataset.mode === "1";
    if (on === !!S.risk.mode) return;
    const go = () => control({ mode: on }, on ? "Mode Extreme aktif" : "Mode Normal aktif").then(ok => { if (ok) { S.risk.mode = on ? 1 : 0; holdSets = 0; renderSettings(); holdSets = Date.now() + 7000; } });
    if (on) confirmBox("Aktifkan mode Extreme?", "Syarat entry semua mesin dilonggarkan: lebih banyak trade dengan sinyal yang lebih lemah. Belum pernah diuji, jadi rugi bisa lebih cepat menumpuk. Posisi yang sudah terbuka tidak berubah.", "Aktifkan Extreme", false, go);
    else go();
    return;
  }
  const tpm = t.closest("[data-tpm]");
  if (tpm) { tpDraft = tpRead(); tpDraft.mode = +tpm.dataset.tpm; holdSets = 0; renderSettings(); const b = document.querySelector('[data-tpm="' + tpDraft.mode + '"]'); if (b) b.focus(); return; }
  if (t.id === "tpsave") {
    const d = tpRead(), bad = v => !(v >= 0);
    if (bad(d.tp_usd) || bad(d.trail_start) || bad(d.trail_dist) || bad(d.be_at) || bad(d.be_lock)) { toast("Isi dengan angka yang benar"); return; }
    if (d.mode === 1 && !(d.tp_usd > 0)) { toast("Target profit harus lebih dari 0"); return; }
    if (d.mode === 2 && !(d.trail_dist > 0)) { toast("Jarak trailing harus lebih dari 0"); return; }
    if (d.mode === 3 && !(d.be_at > 0)) { toast("Pemicu harus lebih dari 0"); return; }
    if (d.be_at > 0 && d.be_lock >= d.be_at) { toast("Profit dikunci harus lebih kecil dari pemicu"); return; }
    control({ tp_mode: d.mode, tp_usd: d.tp_usd, trail_start: d.trail_start, trail_dist: d.trail_dist, be_at: d.be_at, be_lock: d.be_lock }, "Ambil untung disimpan").then(ok => {
      if (!ok) return;
      Object.assign(S.risk, { tp_mode: d.mode, tp_usd: d.tp_usd, trail_start: d.trail_start, trail_dist: d.trail_dist, be_at: d.be_at, be_lock: d.be_lock });
      tpDraft = null; holdSets = 0; document.activeElement.blur(); renderSettings(); holdSets = Date.now() + 7000;
    });
    return;
  }
  if (t.id === "closeall") {
    const n = S ? S.positions.length : 0;
    if (!n) { toast("Tidak ada posisi terbuka"); return; }
    confirmBox("Tutup semua posisi?", n + " posisi milik EA akan ditutup di harga pasar. Tindakan ini tidak bisa dibatalkan.", "Tutup " + n + " posisi", true, () => control({ close_all: true }, "Perintah tutup semua dikirim ke EA"));
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { hideSheet(); $("#modal").classList.remove("show"); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("bot")) { ev.preventDefault(); showSheet(ev.target.dataset.id); }
  if (ev.key === "Enter" && ev.target.classList && ev.target.classList.contains("inp") && ev.target.id !== "pin") { const c = ev.target.closest(".card"), s = c && c.querySelector(".btn.gold"); if (s) s.click(); }
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
